name: bot-request-site

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '8080:8080' 
    env_file:
      - ./backend/.env
    depends_on:
      - database
  
  database:
    image: postgres:18.6
    restart: always
    ports:
    - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - ./.env
    
  admin_panel:
    image: dpage/pgadmin4:9.17
    restart: always
    ports:
    - '8888:80'
    env_file:
      - ./.env
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin-data: